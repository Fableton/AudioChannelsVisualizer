name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        configuration: [Debug, Release]
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build ${{ matrix.configuration }}
        run: msbuild AudioChannels.sln /p:Configuration=${{ matrix.configuration }} /p:Platform=x64 /m /nologo /v:minimal
