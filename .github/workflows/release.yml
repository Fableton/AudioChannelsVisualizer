name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build Release
        run: msbuild AudioChannels.sln /p:Configuration=Release /p:Platform=x64 /m /nologo /v:minimal

      - name: Stage executable
        run: Copy-Item "build\x64\Release\AudioChannels.exe" "AudioChannels.exe"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: AudioChannels.exe
          generate_release_notes: true
